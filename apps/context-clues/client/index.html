<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Context Clues</title>
</head>

<body>
  <div id="app"></div>
  <script>
    (function () {
      const send = (level, message, meta) => {
        fetch("/api/client-log", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ game: "context-clues", level, message, meta }),
          keepalive: true
        }).catch(() => { });
      };

      send("info", "index.html loaded", { href: location.href });

      window.addEventListener("error", (e) => {
        send("error", "window.error", { msg: e.message, file: e.filename, line: e.lineno, col: e.colno, stack: e.error && e.error.stack });
      });

      window.addEventListener("unhandledrejection", (e) => {
        send("error", "unhandledrejection", { reason: (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason) });
      });
    })();
  </script>
  <script type="module" src="./main.js"></script>
</body>

</html>
